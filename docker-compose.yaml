services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks:
      - books-network

  backend:
    image: node:24-bookworm
    working_dir: /app
    volumes:
      - .:/app
      - backend_node_modules:/app/node_modules
    environment:
      MONGODB_URL: mongodb://mongo:27017
    command: >
      sh -c "npm ci &&
             npm run swagger &&
             npm run routes &&
             npm run start-server"
    depends_on:
      - mongo
    ports:
      - "3000:3000"
    networks:
      - books-network

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    networks:
      - books-network

volumes:
  mongo_data:
  backend_node_modules:

networks:
  books-network:
    driver: bridge