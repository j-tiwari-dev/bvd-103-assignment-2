x-backend-common: &backend-common
  image: node:24-bookworm
  working_dir: /app
  volumes:
    - .:/app:ro
    - backend_node_modules:/app/node_modules:ro
  environment:
    MONGODB_URL: mongodb://mongo:27017
  command: npm run start-server
  depends_on:
    - mongo
  networks:
    - books-network
  restart: unless-stopped

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks:
      - books-network

  backend1:
    <<: *backend-common

  backend2:
    <<: *backend-common

  backend3:
    <<: *backend-common

  frontend:
    image: ghcr.io/mcmastercce/bvd-103-mcmasterful-books/mcmasterful-books-docker:main
    restart: unless-stopped
    volumes:
      - ./adapter:/source/adapter:ro
      - ./generated-client:/source/generated-client:ro
    expose:
      - "9080"
    networks:
      - books-network

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend1
      - backend2
      - backend3
      - frontend
    networks:
      - books-network

volumes:
  mongo_data:
  backend_node_modules:

networks:
  books-network:
    driver: bridge