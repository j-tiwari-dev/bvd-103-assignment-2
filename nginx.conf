events {}

http {
    upstream backend {
        server backend:3000;
    }

    server {
        listen 8080;

        # Forward API requests to the backend
        location /api/ {
            proxy_pass http://backend/;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Forward website requests to the frontend
        location / {
            proxy_pass http://frontend:9080;

            proxy_http_version 1.1;

            # Required by the frontend development server
            proxy_set_header Host localhost:9080;

            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Support frontend development server WebSocket connections
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}