events {}

http {
    upstream backend_servers {
        # Nginx uses round-robin load balancing by default.
        server backend1:3000;
        server backend2:3000;
        server backend3:3000;
    }

    server {
        listen 8080;

        # Forward API requests to the three backend instances
        location /api/ {
            proxy_pass http://backend_servers/;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Identify which backend handled each request
            add_header X-Backend-Server $upstream_addr always;
        }

        # Forward website requests to the frontend
        location / {
            proxy_pass http://frontend:9080;

            proxy_http_version 1.1;

            # Required by the frontend development server
            proxy_set_header Host localhost:9080;

            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Support Vite WebSocket connections
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}