events {}

http {
    # Cache for book API responses
    proxy_cache_path /var/cache/nginx/books
        levels=1:2
        keys_zone=books_cache:10m
        max_size=100m
        inactive=60s
        use_temp_path=off;

    # Bypass caching when query parameters are present
    map $args $skip_book_cache {
        default 1;
        "" 0;
    }

    # Three backend instances with round-robin load balancing
    upstream backend_servers {
        server backend1:3000;
        server backend2:3000;
        server backend3:3000;
    }

    server {
        listen 8080;

        # Cache unfiltered book listings and individual book details
        location ~ "^/api/books(?:/[0-9a-fA-F]{24})?/?$" {
            rewrite ^/api/(.*)$ /$1 break;

            proxy_pass http://backend_servers;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Cache successful GET and HEAD responses for 30 seconds
            proxy_cache books_cache;
            proxy_cache_methods GET HEAD;
            proxy_cache_valid 200 30s;

            proxy_cache_bypass $skip_book_cache;
            proxy_no_cache $skip_book_cache;

            add_header X-Cache-Status $upstream_cache_status always;
            add_header X-Backend-Server $upstream_addr always;
        }

        # Other API requests remain uncached
        location /api/ {
            proxy_pass http://backend_servers/;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            add_header X-Backend-Server $upstream_addr always;
        }

        # Frontend assets served by Vite
        # Preserve Vite's own cache headers
        location ~* \.(js|css|png|jpg|jpeg|svg|ico|woff2?)$ {
            proxy_pass http://frontend:9080;

            proxy_http_version 1.1;

            proxy_set_header Host localhost:9080;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # McMasterful Books frontend
        location / {
            proxy_pass http://frontend:9080;

            proxy_http_version 1.1;

            proxy_set_header Host localhost:9080;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Support Vite WebSocket connections
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}