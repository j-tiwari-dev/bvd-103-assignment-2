name: McMasterful Books Assignment 7 CI

on:
  push:
  pull_request:

jobs:
  format_and_lint:
    name: Format and Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Check ESLint
        run: npm run lint

      - name: Check Prettier
        run: npx prettier --check .

  check_types:
    name: Check Types
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - run: npm ci

      - name: Generate Assignment 7 API specifications
        run: |
          for service in books-api warehouse-api orders-api; do
            (
              cd "services/$service"
              npx tsoa spec
              npx tsoa routes
            )
          done

      - name: Generate combined Swagger
        run: node services/swagger-api/src/combine-swagger.cjs

      - name: Generate TypeScript SDK
        run: |
          npx openapi-generator-cli generate \
            -i services/swagger-api/build/swagger.json \
            -g typescript-fetch \
            -o generated-client

      - name: Check root TypeScript
        run: |
          npm run swagger
          npm run routes
          npm run check-types

      - name: Check all microservices
        run: |
          for service in books-api warehouse-api orders-api swagger-api; do
            echo "Checking $service"
            (
              cd "services/$service"
              npx tsc --noEmit
            )
          done

  unit_tests:
    name: Unit and Warehouse Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Run unit tests
        run: npm run test:ci

  sdk_api_tests:
    name: Assignment 7 API Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - run: npm ci

      - name: Start Assignment 7 services
        run: |
          docker compose -f docker-compose.assignment7.yaml up -d

      - name: Initialize Warehouse MongoDB replica set
        run: |
          docker compose -f docker-compose.assignment7.yaml \
            exec -T mongo-warehouse mongosh --quiet --eval '
              try {
                rs.status();
              } catch (error) {
                rs.initiate({
                  _id: "rs0",
                  members: [
                    {
                      _id: 0,
                      host: "mongo-warehouse:27017"
                    }
                  ]
                });
              }
            '

      - name: Wait for Assignment 7 APIs
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent http://localhost:3001/books > /dev/null \
              && curl --fail --silent http://localhost:3003/orders > /dev/null \
              && curl --fail --silent http://localhost:3004/health > /dev/null \
              && curl --fail --silent http://localhost:8081/api/books > /dev/null; then
              echo "Assignment 7 APIs are ready"
              exit 0
            fi

            echo "Waiting for APIs: $attempt/60"
            sleep 3
          done

          docker compose -f docker-compose.assignment7.yaml logs
          exit 1

      - name: Run Assignment 7 API tests
        env:
          API_BASE_URL: http://localhost:8081/api
        run: npm run test:api

      - name: Show Docker logs on failure
        if: failure()
        run: |
          docker compose -f docker-compose.assignment7.yaml ps -a
          docker compose -f docker-compose.assignment7.yaml logs --tail=100

      - name: Stop services
        if: always()
        run: |
          docker compose -f docker-compose.assignment7.yaml down
