events {}
 
http {
    upstream books_api {
        server books-api:3000;
    }
 
    upstream warehouse_api {
        server warehouse-api:3000;
    }
 
    upstream orders_api {
        server orders-api:3000;
    }
 
    upstream swagger_api {
        server swagger-api:3000;
    }
 
    upstream frontend {
        server frontend:9080;
    }
 
    server {
        listen 8080;
 
        location /api/books {
            proxy_pass http://books_api/books;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
 
        location /api/warehouse {
            proxy_pass http://warehouse_api/warehouse;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
 
        location /api/orders {
            proxy_pass http://orders_api/orders;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
 
        location = /api/docs {
            return 301 /api/docs/;
        }
 
        location /api/docs/ {
            proxy_pass http://swagger_api/docs/;
            proxy_set_header Host $host;
        }
 
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
 
            proxy_set_header Host localhost:9080;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
